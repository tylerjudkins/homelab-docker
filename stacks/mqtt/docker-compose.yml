# Do NOT add a top-level "name:" key.
# Portainer sets the Compose project name from the STACK NAME.

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ../../configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - app_net

networks:
  app_net:
    name: ${NETWORK_NAME:-homelab_net}
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
