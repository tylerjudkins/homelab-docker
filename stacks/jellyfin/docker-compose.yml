services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_TAG:-latest}
    container_name: jellyfin            # deliberate exception: single prod instance, not a dev/prod pair
    user: "${PUID}:${PGID}"
    group_add:
      - "${RENDER_GID}"                 # host render group, for QuickSync
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/jellyfin/config:/config
      - ${APPDATA}/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media:ro
    restart: unless-stopped
