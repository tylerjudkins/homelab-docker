# Default Mosquitto config for the homelab MQTT stack.
# allow_anonymous is on because this broker only sits on the internal
# homelab network. Switch to a password_file before exposing it further.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

listener 1883
listener 9001
protocol websockets

allow_anonymous true
